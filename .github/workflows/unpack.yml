
name: Unpack Diwali Project ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o diwali-blast-project.zip -d .
          rm diwali-blast-project.zip

      - name: Commit extracted files
        run: |
          git config user.name "Ankit Vishwakarma"
          git config user.email "203405644+ankitvis99@users.noreply.github.com"
          git add -A
          git commit -m "Add Diwali Blast website source"
          git push
